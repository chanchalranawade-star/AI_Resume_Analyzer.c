<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registered Users - AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>👥 Registered Users</h1>

        <p>Total Registered Users: {{ users|length }}</p>

        {% if users %}

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>

            {% for user in users %}
            <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
            </tr>
            {% endfor %}

        </table>

        {% else %}

        <p>No registered users found.</p>

        {% endif %}

        <br>

        <a href="/hrdashboard">
            <button class="login-btn">
                ⬅ Back to HR Dashboard
            </button>
        </a>

    </div>

</div>

</body>
</html>
