<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resume Preview</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-card history-card">

        <img src="{{ url_for('static', filename='images/resume4.png') }}"
             class="logo">

        <h1>📄 Resume Preview</h1>

        <p>View the uploaded resume below.</p>
        <div style="width:100%; height:800px; margin-top:20px;">

    <iframe
        src="{{ url_for('resume_file', filename=record[1]) }}"
        width="100%"
        height="100%"
        style="border:1px solid #ccc; border-radius:10px;">
    </iframe>

</div>

        <iframe
            src="/resume/{{ record[1] }}"
            class="resume-preview">
        </iframe>

        <br><br>

        {% if from_hr %}

            <a href="/hrdashboard">
                <button class="register-btn">
                    ⬅ Back to HR Dashboard
                </button>
            </a>

        {% else %}

            <a href="/history">
                <button class="register-btn">
                    ⬅ Back to History
                </button>
            </a>

        {% endif %}

    </div>

</div>

</body>

</html>
